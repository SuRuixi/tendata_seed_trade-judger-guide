<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Tendata Trade Judger · 评测平台</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root{
    --bg:#f6f7f9;--panel:#fff;--ink:#0f1720;--ink-2:#3a4552;--mute:#6b7684;
    --line:#e4e7eb;--line-2:#cfd4da;--accent:#1f4b8f;--accent-2:#2d63b8;--accent-soft:#eaf0f9;
    --pass:#166534;--pass-bg:#e7f4ea;--warn:#8a5a00;--warn-bg:#fbf1dc;
    --fail:#a1231d;--fail-bg:#fbe8e6;--code:#f2f3f5;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:"Inter","PingFang SC","Noto Sans SC","Helvetica Neue",Arial,sans-serif;
    font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
  code,pre,.mono{font-family:"JetBrains Mono","IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
  code{background:var(--code);padding:1px 6px;border-radius:3px;color:#2a323b}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  button,input,select,textarea{font-family:inherit;font-size:14px}

  header.top{background:#fff;border-bottom:1px solid var(--line);padding:14px 32px;
    display:flex;align-items:center;gap:20px;position:sticky;top:0;z-index:10}
  header .brand{display:flex;align-items:center;gap:10px}
  header .dot{width:11px;height:11px;background:var(--accent);border-radius:50%}
  header .title{font-weight:600;font-size:15px}
  header .env{font-size:11px;color:var(--mute);letter-spacing:.14em;text-transform:uppercase}
  header nav{display:flex;gap:2px;margin-left:20px}
  header nav a{padding:9px 16px;border-radius:6px;color:var(--ink-2);font-weight:500;font-size:14px}
  header nav a:hover{background:#f0f2f5;text-decoration:none}
  header nav a.active{background:var(--accent-soft);color:var(--accent)}
  header .spacer{flex:1}
  header .status{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mute)}
  header .status .live{width:8px;height:8px;background:#22c55e;border-radius:50%}

  main{max-width:1160px;margin:0 auto;padding:28px 32px 80px}
  .page-title{font-size:22px;font-weight:600;margin:0 0 6px}
  .page-desc{color:var(--mute);font-size:13.5px;margin-bottom:22px}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .card + .card{margin-top:18px}
  .card .head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;
    align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .card .head h3{margin:0;font-size:15px;font-weight:600}
  .card .head .desc{color:var(--mute);font-size:12.5px;margin-top:2px}
  .card .body{padding:20px}

  .btn{padding:8px 16px;border-radius:6px;border:1px solid var(--line-2);background:#fff;
    color:var(--ink-2);cursor:pointer;font-weight:500;transition:all .1s}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.solid{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn.solid:hover{background:var(--accent-2);color:#fff}
  .btn.danger{color:var(--fail);border-color:#e7c1bd}
  .btn.danger:hover{background:var(--fail-bg)}
  .btn.small{padding:5px 10px;font-size:12.5px}
  .btn[disabled]{opacity:.5;cursor:not-allowed}

  .field{margin-bottom:14px}
  .field label{display:block;font-size:12.5px;color:var(--ink-2);margin-bottom:6px;font-weight:500}
  .field .hint{font-size:11.5px;color:var(--mute);margin-top:4px}
  .field input,.field select,.field textarea{width:100%;padding:9px 12px;border:1px solid var(--line-2);
    border-radius:6px;outline:none;background:#fff;transition:border-color .1s}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
  .field textarea{min-height:110px;resize:vertical;font-family:"JetBrains Mono",monospace;font-size:12.5px}
  .row-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:700px){.row-2{grid-template-columns:1fr}}

  .drop{border:2px dashed var(--line-2);border-radius:10px;padding:36px 20px;
    background:#fafbfc;text-align:center;cursor:pointer;transition:all .1s}
  .drop:hover,.drop.hover{border-color:var(--accent);background:var(--accent-soft)}
  .drop .icon{font-size:32px;color:var(--accent);margin-bottom:8px}
  .drop .big{font-size:15px;font-weight:600;color:var(--ink);margin-bottom:4px}
  .drop .small{font-size:12.5px;color:var(--mute)}

  .file-list{margin-top:14px}
  .file-item{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#fafbfc;
    border:1px solid var(--line);border-radius:6px;margin-bottom:6px;font-size:13px}
  .file-item .ico{width:20px;color:var(--accent)}
  .file-item .fname{flex:1;font-family:"JetBrains Mono",monospace;font-size:12.5px}
  .file-item .fsize{color:var(--mute);font-size:11.5px}
  .file-item .rm{color:var(--fail);cursor:pointer;padding:2px 6px}
  .file-item .rm:hover{background:var(--fail-bg);border-radius:4px}

  .tag{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;font-size:11px;
    border-radius:10px;background:var(--code);color:var(--ink-2);font-weight:500}
  .tag.pass{background:var(--pass-bg);color:var(--pass)}
  .tag.warn{background:var(--warn-bg);color:var(--warn)}
  .tag.fail{background:var(--fail-bg);color:var(--fail)}
  .tag.info{background:var(--accent-soft);color:var(--accent)}

  .layers{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:10px}
  @media(max-width:700px){.layers{grid-template-columns:repeat(2,1fr)}}
  .layer{border:1px solid var(--line);border-radius:8px;padding:12px;background:#fff;
    cursor:pointer;transition:all .12s;position:relative}
  .layer:hover{border-color:var(--accent)}
  .layer.on{border-color:var(--accent);background:var(--accent-soft)}
  .layer .code{font-size:10.5px;color:var(--mute);letter-spacing:.1em;font-family:"JetBrains Mono",monospace}
  .layer .name{font-weight:600;font-size:13.5px;margin-top:4px}
  .layer .sub{font-size:11.5px;color:var(--mute);margin-top:2px}
  .layer .check{position:absolute;top:8px;right:8px;width:16px;height:16px;border:1.5px solid var(--line-2);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;background:#fff}
  .layer.on .check{background:var(--accent);border-color:var(--accent)}

  table.tbl{width:100%;border-collapse:collapse;font-size:13px}
  table.tbl th,table.tbl td{padding:11px 14px;border-bottom:1px solid var(--line);text-align:left}
  table.tbl thead th{background:#fafbfc;font-size:11.5px;color:var(--mute);
    text-transform:uppercase;letter-spacing:.06em;font-weight:600}
  table.tbl tbody tr:hover{background:#fafbfc}
  table.tbl td.num,table.tbl th.num{text-align:right;font-variant-numeric:tabular-nums;
    font-family:"JetBrains Mono",monospace}

  .console{background:#0f1720;color:#c9d1da;border-radius:8px;padding:14px 18px;
    font-family:"JetBrains Mono",monospace;font-size:12.5px;line-height:1.75;
    max-height:280px;overflow-y:auto;margin-top:14px}
  .console .ok{color:#61c96f}.console .warn{color:#f0b93a}.console .fail{color:#e56b6b}
  .console .comment{color:#6b7684}.console .prompt{color:#3f8be0}

  .hint{background:var(--accent-soft);border:1px solid #d5e0f2;color:#1a3d70;
    border-radius:8px;padding:12px 16px;font-size:13px;display:flex;gap:10px;align-items:flex-start}
  .hint .i{width:20px;height:20px;flex:0 0 20px;background:var(--accent);color:#fff;
    text-align:center;font-weight:600;font-size:12.5px;line-height:20px;border-radius:50%}

  /* Rules edit panel */
  .rules-layout{display:grid;grid-template-columns:280px 1fr;gap:0;min-height:520px}
  @media(max-width:900px){.rules-layout{grid-template-columns:1fr}}
  .rules-list{border-right:1px solid var(--line);max-height:640px;overflow-y:auto}
  .rules-list .search{padding:12px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff}
  .rules-list .search input{width:100%;padding:7px 10px;border:1px solid var(--line-2);border-radius:6px}
  .rules-list .skill-pills{display:flex;flex-wrap:wrap;gap:4px;padding:8px 14px;border-bottom:1px solid var(--line)}
  .rules-list .skill-pills .p{font-size:11.5px;padding:3px 10px;border-radius:12px;
    background:#fff;border:1px solid var(--line-2);cursor:pointer;color:var(--ink-2)}
  .rules-list .skill-pills .p.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .rules-list .item{padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
  .rules-list .item:hover{background:#fafbfc}
  .rules-list .item.on{background:var(--accent-soft)}
  .rules-list .item .rid{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--mute)}
  .rules-list .item .rtitle{font-size:13px;font-weight:500;margin-top:2px}
  .rule-edit{padding:20px 24px}
  .rule-edit .id-badge{display:inline-block;font-family:"JetBrains Mono",monospace;font-size:11px;
    padding:3px 10px;background:var(--code);border-radius:12px;color:var(--ink-2);margin-bottom:6px}

  /* Config */
  .kv-grid{display:grid;grid-template-columns:180px 1fr;gap:10px 16px;padding:12px 0}
  .kv-grid label{color:var(--ink-2);font-size:13px;padding-top:8px}
  .kv-grid input,.kv-grid select{padding:8px 12px;border:1px solid var(--line-2);border-radius:6px;width:100%;background:#fff}
  .kv-grid .h{grid-column:1/-1;font-size:12px;color:var(--mute);letter-spacing:.06em;
    text-transform:uppercase;padding:12px 0 4px;border-top:1px dashed var(--line);margin-top:8px;font-weight:600}
  .kv-grid .h:first-child{padding-top:0;border-top:none;margin-top:0}
  .kv-grid .hint-inline{grid-column:2;font-size:11.5px;color:var(--mute);margin-top:-4px}

  .toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#0f1720;
    color:#fff;padding:10px 18px;border-radius:22px;font-size:13px;opacity:0;
    pointer-events:none;transition:opacity .2s;z-index:100}
  .toast.on{opacity:1}

  .modal-bg{position:fixed;inset:0;background:rgba(15,23,32,.55);display:none;
    align-items:center;justify-content:center;z-index:50;padding:20px}
  .modal-bg.open{display:flex}
  .modal{background:#fff;border-radius:12px;width:min(920px,96vw);max-height:88vh;overflow:auto}
  .modal .mhead{padding:16px 22px;border-bottom:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:center}
  .modal .mhead h3{margin:0;font-size:15px;font-weight:600}
  .modal .mbody{padding:22px}
  .modal .mfoot{padding:14px 22px;border-top:1px solid var(--line);display:flex;
    justify-content:flex-end;gap:8px}
  .close-x{background:none;border:none;font-size:22px;color:var(--mute);cursor:pointer}
  /* Markdown 报告样式 */
  .md-report h1{font-size:20px;margin:8px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
  .md-report h2{font-size:16px;margin:22px 0 10px;color:var(--accent);border-left:3px solid var(--accent);padding-left:10px}
  .md-report h3{font-size:14.5px;margin:16px 0 8px;color:var(--ink-2)}
  .md-report table{width:100%;border-collapse:collapse;margin:10px 0;font-size:13px}
  .md-report th,.md-report td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
  .md-report th{background:#fafbfc;font-weight:600}
  .md-report code{background:var(--code);padding:1px 6px;border-radius:3px;font-family:"JetBrains Mono",monospace;font-size:12.5px}
  .md-report pre{background:#0f1720;color:#c9d1da;padding:12px 14px;border-radius:6px;overflow-x:auto;font-size:12px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
  .md-report blockquote{margin:8px 0;padding:8px 14px;border-left:3px solid var(--accent);background:var(--accent-soft);color:var(--ink-2);border-radius:0 6px 6px 0}
  .md-report ul{padding-left:20px}
  .md-report li{margin:3px 0}
  .md-report p{margin:6px 0;line-height:1.7}

  .stat{background:#fafbfc;border-radius:6px;padding:12px 14px}
  .stat .l{font-size:11.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
  .stat .v{font-size:22px;font-weight:600;margin-top:2px}
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <span class="dot"></span>
    <div>
      <div class="title">Tendata Trade Judger</div>
      <div class="env">Evaluation Platform · v1.0</div>
    </div>
  </div>
  <nav>
    <a href="#/upload"  data-nav="upload"  class="active">① 上传评估</a>
    <a href="#/rules"   data-nav="rules">② 规则管理</a>
    <a href="#/config"  data-nav="config">③ Judger 配置</a>
  </nav>
  <div class="spacer"></div>
  <div class="status">
    <span class="live"></span>
    <span id="config-status">Judger 已连接</span>
  </div>
</header>

<main id="view"><div style="padding:40px;color:var(--mute)">加载中...</div></main>

<div class="toast" id="toast"></div>
<div class="modal-bg" id="modal"><div class="modal" id="modal-inner"></div></div>

<script>
// ============================================================
// Tendata Trade Judger · 简化评测平台
// 三大功能：批量上传评估 · 规则管理 · Judger 配置
// ============================================================

const PAGES = {
  upload: '批量上传与评估',
  rules:  '评测规则管理',
  config: 'Judger 模型配置'
};

// 状态：本地持久化
const LS_RULES  = 'ttj.rules.v1';
const LS_CONFIG = 'ttj.config.v1';
const LS_JOBS   = 'ttj.jobs.v1';
const LS_SESSION = 'ttj.session.v1';   // 上传页会话状态（跨页切换保留）

function loadJSON(key, def) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : def; }
  catch (e) { return def; }
}
function saveJSON(key, val) { localStorage.setItem(key, JSON.stringify(val)); }

// 会话状态：files 元信息 + layers 勾选 + 控制台日志 + 最新结果
// 用 window._session 作单例，避免每次 renderUpload 都重建
if (!window._session) {
  const restored = loadJSON(LS_SESSION, null);
  window._session = restored && typeof restored === 'object' ? restored : {
    files: [],
    layers: { j1:true, j2:true, j3:true, j4:false, j5:true },
    consoleLog: [],
    results: [],
    running: false
  };
}
function persistSession() {
  const s = window._session;
  const clean = {
    files: (s.files || []).map(f => ({
      name: f.name, size: f.size, type: f.type,
      task: f.task, model: f.model, synthetic: f.synthetic,
      _inline: f._inline || null,
      _fileText: f._fileText || null
    })),
    layers: s.layers,
    consoleLog: (s.consoleLog || []).slice(-500),
    results: s.results || [],
    running: false
  };
  try { saveJSON(LS_SESSION, clean); } catch (e) {}
}

// 默认配置
const DEFAULT_CONFIG = {
  backend_url: 'http://localhost:8787',
  provider: 'volcengine-ark',
  model_id: 'doubao-seed-evolving',
  api_key: '',
  base_url: 'https://ark.cn-beijing.volces.com/api/v3',
  api_style: 'auto',
  temperature: 0.1,
  max_tokens: 8192,
  timeout_ms: 180000,
  concurrency: 4,
  fallback_model_id: '',
  fallback_api_key: ''
};

// 默认规则：优先从 data/rules.json（由 tools/bake.js 从官方 Skill 包烘焙）加载完整 57 条；
// 首次加载失败则用下面的精简 fallback，保证「file://」直接打开也可用。
let DEFAULT_RULES = [
  { id:'RULE-J1-001', skill:'j1', title:'用户问题必须转成可执行的外贸分析任务',
    applies:'用户任务涉及市场、客户、企业、竞争、风险、商品、国家、贸易方向、时间或指标。',
    judgement:'模型应先识别用户要支持的业务决策，并把问题转成可执行分析定义：商品范围、贸易方向、报告主体、伙伴范围、时间窗口、指标和输出目标。',
    severity:'次要槽位不清=partial；核心理解错误=major；服务错对象=critical', enabled:true, weight:1.0 },
  { id:'RULE-J1-002', skill:'j1', title:'商品范围必须支撑分析目标',
    applies:'用户以 HS 编码、产品名称、行业词、公司历史记录或竞品发起查询。',
    judgement:'模型应说明商品范围如何落到可分析口径；做企业深析时先识别其核心交易商品。',
    severity:'描述不完整=minor；范围过宽/过窄=major；核心识别错误=critical', enabled:true, weight:1.0 },
  { id:'RULE-J1-003', skill:'j1', title:'时空边界必须匹配结论强度',
    applies:'涉及趋势、市场推荐、客户活跃度、竞争比较或风险判断的任务。',
    judgement:'明确统计时间窗口与地理覆盖，并判断是否足以支撑结论；短窗口不推长期趋势。',
    severity:'边界模糊=minor；未标注=major；窗口不足支撑强推荐=critical', enabled:true, weight:1.0 },
  { id:'RULE-J2-001', skill:'j2', title:'每一条 Data Claim 必须有可核验来源',
    applies:'报告出现具体数字、公司名、贸易额、增速等断言。',
    judgement:'每条 Claim 必须提供 evidence_refs 指向真实来源；不得以常识补写。',
    severity:'来源不完整=partial；虚构数字=critical', enabled:true, weight:1.0 },
  { id:'RULE-J2-002', skill:'j2', title:'币种与单位不得错配',
    applies:'涉及金额、体积、重量的任何断言。',
    judgement:'币种（CNY/USD/EUR）与单位（KG/T/PCS）必须显式声明并保持一致。',
    severity:'单位缺失=partial；币种错配=critical', enabled:true, weight:1.5 },
  { id:'RULE-J2-003', skill:'j2', title:'同比、环比等计算必须公式正确',
    applies:'报告出现 YoY / MoM / CAGR 等衍生指标。',
    judgement:'公式必须为 (本期-上期)/上期；分母不得为负或为零；结果保留业务合理精度。',
    severity:'公式错误=critical；精度不当=minor', enabled:true, weight:1.2 },
  { id:'RULE-J3-001', skill:'j3', title:'任务契约必须逐项覆盖',
    applies:'任务契约含多项 required_deliverable。',
    judgement:'契约中每条 should_generate=true 项，报告必须存在对应产出；缺失不得掩盖。',
    severity:'次要遗漏=partial；核心遗漏=critical', enabled:true, weight:1.0 },
  { id:'RULE-J3-002', skill:'j3', title:'should_generate 与验收态严格正交',
    applies:'契约生成阶段与验收阶段。',
    judgement:'「应否生成」与「验收状态」是两个正交轴，不得因不应生成而计入 covered。',
    severity:'混淆=major', enabled:true, weight:1.0 },
  { id:'RULE-J4-001', skill:'j4', title:'Pairwise 全局唯一 comparison_id',
    applies:'J4 pairwise 比较输入。',
    judgement:'comparison_id 在全局唯一；重复项前置拒绝，不进入 BTD MLE。',
    severity:'冲突=critical', enabled:true, weight:1.0 },
  { id:'RULE-J4-002', skill:'j4', title:'Same 判定必须给出 same_reason',
    applies:'outcome=Same 的比较。',
    judgement:'必须提供 same_reason，且同向重复必须一致；否则拒绝。',
    severity:'缺失=major；冲突=critical', enabled:true, weight:1.0 },
  { id:'RULE-J5-001', skill:'j5', title:'负面判断必须附 evidence_refs',
    applies:'J5 findings 内所有 severity ∈ {major,critical} 的项。',
    judgement:'负面判断必须携带非空 evidence_refs 与 quoted_evidence；否则视为无效。',
    severity:'缺失=critical', enabled:true, weight:1.5 },
  { id:'RULE-J5-002', skill:'j5', title:'Critical 不得被平均分抵消',
    applies:'J5 汇总打分。',
    judgement:'任一层出现 critical 时，总分需触发下限或降级；不得以其它维度高分掩盖。',
    severity:'违反=critical', enabled:true, weight:2.0 }
];

// 异步加载完整规则集（官方 5 层共 57 条），覆盖 DEFAULT_RULES；
// 首次访问时同步写入 localStorage，保证「规则管理」页立刻看到完整规则。
(async function loadOfficialRules () {
  try {
    const res = await fetch('data/rules.json', { cache: 'no-store' });
    if (!res.ok) return;
    const rules = await res.json();
    if (!Array.isArray(rules) || !rules.length) return;
    const enriched = rules.map(r => Object.assign({ enabled: true, weight: 1.0 }, r));
    DEFAULT_RULES = enriched;
    if (!localStorage.getItem(LS_RULES)) {
      saveJSON(LS_RULES, enriched);
      if (location.hash.slice(2).startsWith('rules')) renderRules();
    }
  } catch (e) {
    console.warn('[rules] 加载 data/rules.json 失败，将使用内置精简规则：', e);
  }
})();

function esc(s) {
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

    ev.preventDefault();
    const items = ev.dataTransfer.items;
    if (items && items[0] && items[0].webkitGetAsEntry) {
      const files = [];
      const entries = [];
      for (const it of items) { const en = it.webkitGetAsEntry(); if (en) entries.push(en); }

  async function walkEntry(entry, prefix, out) {
    if (entry.isFile) {
      await new Promise(res => entry.file(f => {
        try { Object.defineProperty(f, 'webkitRelativePath', { value: prefix + f.name }); } catch (e) {}
        out.push(f); res();
      }));
    } else if (entry.isDirectory) {
      const reader = entry.createReader();
      await new Promise(res => reader.readEntries(async ents => {
        for (const e of ents) await walkEntry(e, prefix + entry.name + '/', out);
        res();
      }));
    }
  }

  async function ingestFiles(list, source) {
    const arr = Array.from(list || []);
    if (!arr.length) return;
    let added = 0;
    for (const f of arr) {
      if (state.files.length >= 500) break;
      if (/\.jsonl$/i.test(f.name)) {
        const n = await ingestJsonl(f, true);
        added += n;
        continue;
      }
      const rel = f.webkitRelativePath || f.name;
      // 先读文本一次，落到 _fileText 以便跨页/刷新后仍能重发
      let text = null;
      try { text = await f.text(); } catch (e) {}
      state.files.push({ name: rel, size: f.size, type: guessType(rel), _file: f, _fileText: text });
      added++;
    }
    renderFiles();
    persistSession();
    toast('已添加 ' + added + ' 条任务' + (source === 'folder' ? '（来自文件夹）' : ''));
  }

  async function ingestJsonl(file, silent) {
    if (!file) return 0;
    const text = await file.text();
    let count = 0;
    const stem = file.name.replace(/\.[^.]+$/, '');
    text.split(/\r?\n/).forEach((line, i) => {
      const t = line.trim();
      if (!t || state.files.length >= 500) return;
      try {
        const obj = JSON.parse(t);
        const task = obj.task_id || obj.task || (stem + '#L' + (i + 1));
        const model = obj.model_id || obj.model || 'unknown';
        state.files.push({
          name: stem + '_' + task + '_' + model + '.json',
          size: t.length,
          type: 'jsonl-line',
          task, model,
          _inline: obj
        });
        count++;
      } catch (e) {}
    });
    renderFiles();
    persistSession();
    if (!silent) toast('从 ' + file.name + ' 展开 ' + count + ' 条任务');
    return count;
  }

  function guessType(name) {
    if (/trace/i.test(name)) return 'trace';
    if (/output|report/i.test(name)) return 'output';
    if (/\.jsonl$/i.test(name)) return 'jsonl';
    if (/\.zip$/i.test(name)) return 'batch-zip';

  async function runSynthesize() {
    const results = (state.results || []).filter(r => r && r._real);
    if (!results.length) {
      toast('尚无真实评估结果 · 请先运行一次评估');
      return;
    }
    const config = loadJSON(LS_CONFIG, DEFAULT_CONFIG);
    if (!config.api_key) {
      toast('未配置 API Key · 请到 ③ Judger 配置');
      return;
    }
    const btn = document.getElementById('btn-synth');
    if (btn) { btn.disabled = true; btn.textContent = '🧠 综合分析中...'; }
    let con = document.getElementById('console');
    if (con) { con.style.display = 'block'; }
    log(con, '🧠 综合分析 · 提交 ' + results.length + ' 份结果给 ' + config.model_id, 'em');
    try {
      const t0 = Date.now();
      const res = await fetch(config.backend_url.replace(/\/$/, '') + '/synthesize', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ results, config }),
      });
      if (!res.ok) {
        const err = await res.text();
        throw new Error('HTTP ' + res.status + ' · ' + err.slice(0, 300));
      }
      const data = await res.json();
      log(con, '✔ 综合分析完成 · ' + (Date.now() - t0) + ' ms · workdir=' + (data.workdir || '—'), 'ok');
      showSynthesisReport(data);
    } catch (e) {
      log(con, '✗ 综合分析失败：' + e.message, 'warn');
      toast('综合分析失败：' + e.message.slice(0, 120));
    } finally {
      if (btn) { btn.disabled = false; btn.textContent = '🧠 综合分析'; }
    }
  }
  window.runSynthesize = runSynthesize;

  async function runEvaluation() {
    const btn = document.getElementById('btn-run'); if (btn) { btn.disabled = true; btn.textContent = '评估中...'; }
    let con = document.getElementById('console'); if (con) { con.style.display = 'block'; con.innerHTML = ''; }
    const activeLayers = Object.keys(state.layers).filter(k => state.layers[k]);
    if (!activeLayers.length) { toast('请至少选择一个 Judger 层'); if (btn) { btn.disabled = false; btn.textContent = '▶ 运行评估'; } return; }

    // 切页后 con 会失效，用一个 getter 每次动态取
    const getCon = () => document.getElementById('console');
    // 标记会话为运行中，并更新顶栏
    state.running = true;
    state.consoleLog = []; state.results = [];
    persistSession(); updateTopStatus();

    const backend = (config.backend_url || 'http://localhost:8787').replace(/\/$/, '');
    log(getCon(), '# 启动 Tendata Trade Judger 评估', 'comment');
    log(getCon(), '[config] model=' + config.model_id + ' · layers=' + activeLayers.join(',') + ' · files=' + state.files.length, 'ok');
    log(getCon(), '[gateway] 尝试连接 ' + backend + ' ...', 'prompt');

    let online = false;
    try {
      const r = await fetch(backend + '/health', { method: 'GET' });
      if (r.ok) {
        const j = await r.json();
        online = true;
        log(getCon(), '[gateway] 已连接 · skills=' + JSON.stringify(j.skills_available), 'ok');
      }
    } catch (e) {
      log(getCon(), '[gateway] 连接失败：' + e.message, 'warn');
    }

    let results = [];
    try {
      if (online) {
        results = await runViaBackend(backend, config, activeLayers, getCon);
      } else {
        log(getCon(), '[fallback] 后端未启动，改用前端模拟数据（仅演示用）', 'warn');
        results = await runViaMock(activeLayers, getCon());
      }
    } finally {
      state.running = false;
    }

    log(getCon(), '✔ 全部完成 · 共处理 ' + state.files.length + ' 个文件', 'ok');
    const jobs = loadJSON(LS_JOBS, []);
    jobs.unshift({ ts: Date.now(), n: state.files.length, layers: activeLayers, results, real: online });
    saveJSON(LS_JOBS, jobs.slice(0, 20));

    // 只有当仍在 upload 页时才 renderResults 到 DOM；否则仅保存到 session
    state.results = results;
    if (document.getElementById('results')) renderResults(results);
    persistSession(); updateTopStatus();
    const btn2 = document.getElementById('btn-run');
    if (btn2) { btn2.disabled = false; btn2.textContent = '▶ 再次运行'; }
  }

  async function runViaBackend(backend, cfg, layers, conOrGetter) {
    const con = () => typeof conOrGetter === 'function' ? conOrGetter() : conOrGetter;
    // 逐个任务读取文件内容并组装成后端所需 payload
    const tasks = [];
    for (const f of state.files) {
      let obj = null;
      if (f._inline) obj = f._inline;
      else if (f._fileText) {
        try { obj = JSON.parse(f._fileText); } catch (e) { obj = { trace: '', output: f._fileText }; }
      }
      else if (f._file) {
        try { obj = JSON.parse(await f._file.text()); } catch (e) { obj = { trace: '', output: await f._file.text() }; }
      } else if (f.synthetic) {
        obj = { task_id: f.task, model_id: f.model, trace: '演示 trace', output: '演示 output' };
      } else {
        obj = { task_id: f.task || f.name, model_id: f.model || 'model-x' };
      }
      // 规范化字段
      const task = {
        task_id: obj.task_id || f.task || f.name.replace(/\.[^.]+$/, ''),
        model_id: obj.model_id || f.model || 'model-x',
        trace: obj.trace || null,
        output: obj.output || obj.report || null,
        j1_input: obj.j1_input || obj.j1 || null,
        j2_input: obj.j2_input || obj.j2 || null,
        j3_input: obj.j3_input || obj.j3 || null,
      };
      tasks.push(task);
    }

    log(con(), '[POST] ' + backend + '/evaluate/stream · tasks=' + tasks.length + ' (SSE)', 'prompt');
    // 用「事件顺序 + task_start.index」路由，避免 task_id 重复覆盖
    const rows = tasks.map((t, i) => ({
      file: state.files[i]?.name || t.task_id, task: t.task_id, model: t.model_id, _real: true
    }));
    let currentRow = null;   // 当前 task_start 后到 task_done 前的行
    let currentIdx = 0;

    try {
      const resp = await fetch(backend + '/evaluate/stream', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'text/event-stream' },
        body: JSON.stringify({ tasks, layers, config: {
          provider: cfg.provider, model_id: cfg.model_id, api_key: cfg.api_key,
          base_url: cfg.base_url, api_style: cfg.api_style || 'auto',
          temperature: cfg.temperature, max_tokens: cfg.max_tokens,
          timeout_ms: cfg.timeout_ms, concurrency: cfg.concurrency,
        }}),
      });
      if (!resp.ok) {
        const txt = await resp.text();
        log(con(), '[gateway] 评估失败：' + txt.slice(0, 300), 'fail');
        return rows;
      }
      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buf = '';
      const LAYER_ICON = { j1: 'J1 · 方法论', j2: 'J2 · 忠实度', j3: 'J3 · 完整度', j4: 'J4 · 排序', j5: 'J5 · 追溯' };

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        let sep;
        while ((sep = buf.indexOf('\n\n')) !== -1) {
          const chunk = buf.slice(0, sep); buf = buf.slice(sep + 2);
          let event = 'message', data = '';
          for (const line of chunk.split('\n')) {
            if (line.startsWith('event: ')) event = line.slice(7).trim();
            else if (line.startsWith('data: ')) data += line.slice(6);
          }
          let payload = {};
          try { payload = JSON.parse(data); } catch (e) {}
          try { handleEvent(event, payload); } catch (e) {
            log(con(), '[gateway] 单事件渲染异常（已忽略）：' + e.message, 'warn');
            console.error('handleEvent error', event, payload, e);
          }
        }
      }

      function handleEvent(event, p) {
        const marker = '[' + (currentIdx + 1) + '/' + tasks.length + '] ';
        if (event === 'all_start') {
          log(con(), '⚡ 开始流式评估 · ' + p.count + ' 任务 · layers=' + p.layers.join(',') + ' · model=' + p.model, 'ok');
        } else if (event === 'task_start') {
          // 后端 index 从 1 开始
          currentIdx = Math.max(0, (p.index || 1) - 1);
          currentRow = rows[currentIdx];
          log(con(), '▶ [' + (p.index || (currentIdx+1)) + '/' + (p.total || tasks.length) + '] ' + p.task + ' · ' + p.model, 'prompt');
        } else if (event === 'layer_start') {
          log(con(), marker + LAYER_ICON[p.layer] + ' · 开始 ...', 'comment');
        } else if (event === 'layer_progress') {
          const label = { llm_call:'📡 LLM', llm_done:'📥 LLM 完成', llm_fail:'⚠ LLM 失败', preset:'📦 使用预置输入', assembled:'🧩 组装 upstream', cli_run:'⚙ 运行 Node CLI' }[p.stage] || p.stage;
          const extra = p.bytes ? (' · ' + p.bytes + ' bytes') :
                        p.note ? (' · ' + p.note) :
                        p.keys ? (' · keys=' + p.keys) :
                        p.error ? (' · ' + p.error) : '';
          log(con(), marker + '  ' + label + extra, p.stage === 'llm_fail' ? 'warn' : 'ok');
        } else if (event === 'layer_done') {
          if (currentRow) currentRow[p.layer] = normalizeLayer(p.layer, p.summary);
          const s = currentRow && currentRow[p.layer];
          log(con(), marker + '  ✔ ' + LAYER_ICON[p.layer] + ' · ' + summarize(p.layer, s), (s && s.critical) ? 'warn' : 'ok');
          // 逐层增量渲染结果表
          if (window._session) { window._session.results = rows; persistSession(); }
          if (document.getElementById('results')) _renderResultsFromSession({ results: rows, layers: state.layers });
        } else if (event === 'layer_skip') {
          if (currentRow) currentRow[p.layer] = { skipped: true, reason: p.reason };
          log(con(), marker + '  ⊘ ' + LAYER_ICON[p.layer] + ' 已跳过：' + p.reason, 'warn');
        } else if (event === 'layer_error') {
          if (currentRow) currentRow[p.layer] = { error: p.error };
          log(con(), marker + '  ✗ ' + LAYER_ICON[p.layer] + ' ' + String(p.error).slice(0, 200), 'fail');
        } else if (event === 'task_done') {
          if (currentRow) {
            currentRow.report_md = p.report_md || '';
            currentRow.workdir = p.workdir || '';
          }
          if (window._session) { window._session.results = rows; persistSession(); }
          if (document.getElementById('results')) _renderResultsFromSession({ results: rows, layers: state.layers });
          log(con(), marker + '✓ ' + p.task + ' 完成 · Markdown 报告已生成', 'ok');
        } else if (event === 'all_done') {
          log(con(), '⚡ 全部完成 · ' + p.count + ' 任务', 'ok');
        }
      }

      return rows;
    } catch (e) {
      log(con(), '[gateway] 请求异常：' + e.message, 'fail');
      return rows;
    }
  }

  function normalizeLayer(layer, s) {
    if (layer === 'j1') return { score: s.score, coverage: s.evidence_coverage, critical: s.critical_failure };
    if (layer === 'j2') return { wdr: s.weighted_deviation_rate, claims: s.claims };
    if (layer === 'j3') return { score: s.overall_score, covered: s.covered, total: s.total };
    if (layer === 'j4') return { status: s.status, rankings: s.rankings };
    if (layer === 'j5') return { findings: s.findings, unresolved: s.unresolved, critical: !s.closure_ok };
    return s;
  }

  async function runViaMock(activeLayers, con) {
    const results = [];
    for (let i = 0; i < state.files.length; i++) {
      const f = state.files[i];
      log(con, '[' + (i+1) + '/' + state.files.length + '] ' + f.name + ' · [mock]', 'warn');
      await sleep(150);
      const r = { file: f.name, task: f.task || ('task-' + (i+1)), model: f.model || 'model-x', _real: false };
      for (const layer of activeLayers) {
        r[layer] = mockScore(layer, f);
        log(con, '  · ' + layer.toUpperCase() + ' · ' + summarize(layer, r[layer]) + ' (mock)', r[layer].critical ? 'warn' : 'ok');
      }
      results.push(r);
    }
    return results;
  }

  function renderResults(rows) {
    const box = document.getElementById('results');
    const headers = ['文件', '任务', '模型'];
    const active = Object.keys(state.layers).filter(k => state.layers[k]);
    active.forEach(k => headers.push(k.toUpperCase()));
    headers.push('操作');
    box.innerHTML =
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">'
      + '<h3 style="margin:0;font-size:14px">评估结果 · ' + rows.length + ' 个任务</h3>'
      + '<div><button class="btn small" onclick="downloadResults(&#39;json&#39;)">↓ JSON</button> '
      + '<button class="btn small" onclick="downloadResults(&#39;csv&#39;)">↓ CSV</button></div></div>'
      + '<table class="tbl"><thead><tr>' + headers.map(h => '<th>' + h + '</th>').join('') + '</tr></thead><tbody>'
      + rows.map((r, i) => '<tr>'
        + '<td class="mono" style="font-size:12px">' + esc(r.file) + '</td>'
        + '<td>' + esc(r.task) + '</td>'
        + '<td><strong>' + esc(r.model) + '</strong></td>'
        + active.map(k => '<td class="num">' + cellHTML(k, r[k]) + '</td>').join('')
        + '<td><a href="#" onclick="showRow(' + i + ');return false">查看 →</a></td></tr>'
      ).join('') + '</tbody></table>'
      + _synthBar(rows);
    window._lastResults = rows;
    if (window._session) { window._session.results = rows; persistSession(); }
  }
}

function mockScore(layer, f) {
  const seed = (f.name || '').length + (f.model === 'model-b' ? 100 : 0);
  const rnd = ((seed * 9301 + 49297) % 233280) / 233280;
  if (layer === 'j1') return { score: +(f.model === 'model-b' ? 12 + rnd*10 : 78 + rnd*15).toFixed(2), coverage: +(0.8 + rnd*0.2).toFixed(3), critical: f.model === 'model-b' };
  if (layer === 'j2') return { wdr: +(f.model === 'model-b' ? 0.7 + rnd*0.2 : 0.02 + rnd*0.1).toFixed(4), claims: Math.round(6 + rnd*8) };
  if (layer === 'j3') return { score: +(f.model === 'model-b' ? 55 + rnd*15 : 88 + rnd*10).toFixed(2), covered: Math.round(6 + rnd*4), total: 10 };
  if (layer === 'j4') return { rank: f.model === 'model-b' ? 2 : 1, score: f.model === 'model-b' ? 0 : 100 };
  if (layer === 'j5') return { findings: f.model === 'model-b' ? 2 : 0, critical: f.model === 'model-b' };
  return {};
}
function summarize(layer, r) {
  if (!r || typeof r !== 'object') return '—';
  const fmt = (v, d) => (v == null || Number.isNaN(+v)) ? 'n/a' : (+v).toFixed(d);
  const pct = (v) => (v == null || Number.isNaN(+v)) ? 'n/a' : (v * 100).toFixed(1) + '%';
  if (layer === 'j1') return 'score=' + fmt(r.score, 2) + ' · coverage=' + pct(r.coverage) + (r.critical ? ' · CRITICAL' : '');
  if (layer === 'j2') return 'WDR=' + fmt(r.wdr, 4) + ' · claims=' + (r.claims ?? 0);
  if (layer === 'j3') return 'score=' + fmt(r.score, 2) + ' · ' + (r.covered ?? 0) + '/' + (r.total ?? 0);
  if (layer === 'j4') return 'rank=' + (r.rank ?? '—') + ' · score=' + fmt(r.score, 2);
  if (layer === 'j5') return 'findings=' + (r.findings ?? 0) + (r.critical ? ' · critical' : '');
  return '';
}
function cellHTML(layer, r) {
  if (!r) return '—';
  if (r.skipped) return '<span class="tag warn" title="' + esc(r.reason || '') + '">跳过</span>';
  if (r.error) return '<span class="tag fail" title="' + esc(typeof r.error==='string'?r.error:JSON.stringify(r.error)) + '">失败</span>';
  if (layer === 'j1') return r.score == null ? '—' : colorNum(r.score, 60, 40);
  if (layer === 'j2') {
    if (r.wdr == null || Number.isNaN(+r.wdr)) return '<span class="tag" title="所有 claim 均为 insufficient_evidence，无可评估条目">n/a</span>';
    return colorNum(1 - (+r.wdr), 0.9, 0.7, (+r.wdr).toFixed(3));
  }
  if (layer === 'j3') return r.score == null ? '—' : colorNum(r.score, 80, 60);
  if (layer === 'j4') return '<span class="tag ' + (r.rank === 1 ? 'pass':'fail') + '">Rank ' + (r.rank ?? '—') + '</span>';
  if (layer === 'j5') return r.critical ? '<span class="tag fail">' + (r.findings ?? 0) + ' critical</span>' : ((r.findings ?? 0) + ' findings');
  return '';
}
function colorNum(v, ok, bad, label) {
  if (v == null || Number.isNaN(v)) return '—';
  const l = label != null ? label : Number(v).toFixed(2);
  const color = v >= ok ? 'var(--pass)' : v <= bad ? 'var(--fail)' : 'var(--warn)';
  return '<span style="color:' + color + ';font-weight:600">' + l + '</span>';
}

// ---------- 轻量 Markdown 渲染（保守子集：标题/表格/列表/引用/代码/加粗/行内代码） ----------
function renderMarkdown(md) {
  if (!md) return '';
  const lines = String(md).replace(/\r\n?/g, '\n').split('\n');
  const out = [];
  let i = 0;

  function inline(s) {
    let t = esc(s);
    // 行内代码
    t = t.replace(/`([^`]+)`/g, (_, x) => '<code>' + x + '</code>');
    // 粗体 **x**
    t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    // 斜体 *x*  (避免误伤已经处理的粗体，故这里再来一次)
    t = t.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
    return t;
  }

  while (i < lines.length) {
    const ln = lines[i];
    // 代码块
    if (/^```/.test(ln)) {
      const body = [];
      i++;
      while (i < lines.length && !/^```/.test(lines[i])) { body.push(lines[i]); i++; }
      i++;
      out.push('<pre>' + esc(body.join('\n')) + '</pre>');
      continue;
    }
    // 标题
    let m = /^(#{1,6})\s+(.*)$/.exec(ln);
    if (m) { const lv = m[1].length; out.push('<h' + lv + '>' + inline(m[2]) + '</h' + lv + '>'); i++; continue; }
    // 表格
    if (/^\|.*\|/.test(ln) && i+1 < lines.length && /^\|[\s\-:|]+\|$/.test(lines[i+1])) {
      const parseRow = row => row.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(s => s.trim());
      const head = parseRow(ln);
      i += 2;
      const rows = [];
      while (i < lines.length && /^\|.*\|/.test(lines[i])) { rows.push(parseRow(lines[i])); i++; }
      let t = '<table><thead><tr>' + head.map(h => '<th>' + inline(h) + '</th>').join('') + '</tr></thead><tbody>';
      for (const r of rows) t += '<tr>' + r.map(c => '<td>' + inline(c) + '</td>').join('') + '</tr>';
      t += '</tbody></table>';
      out.push(t);
      continue;
    }
    // 引用
    if (/^>\s?/.test(ln)) {
      const body = [];
      while (i < lines.length && /^>\s?/.test(lines[i])) { body.push(lines[i].replace(/^>\s?/, '')); i++; }
      out.push('<blockquote>' + inline(body.join(' ')) + '</blockquote>');
      continue;
    }
    // 列表
    if (/^\s*[-*]\s+/.test(ln)) {
      const items = [];
      let indent = ln.match(/^(\s*)/)[1].length;
      while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) {
        const t = lines[i].replace(/^\s*[-*]\s+/, '');
        items.push('<li>' + inline(t) + '</li>');
        i++;
        // 简单缩进的子列表合并到父项内（去掉一级缩进）
        while (i < lines.length && /^\s{2,}[-*]\s+/.test(lines[i])) {
          items[items.length - 1] = items[items.length - 1].replace(/<\/li>$/, '')
            + '<br>' + inline(lines[i].replace(/^\s+[-*]\s+/, '· ')) + '</li>';
          i++;
        }
      }
      out.push('<ul>' + items.join('') + '</ul>');
      continue;
    }
    // 空行
    if (!ln.trim()) { i++; continue; }
    // 普通段落
    out.push('<p>' + inline(ln) + '</p>');
    i++;
  }
  return out.join('\n');
}

function log(con, txt, cls) {
  // con 可能已因切页而被销毁；始终写入 session buffer，DOM 存在时也追加节点
  if (con && con.appendChild) {
    const div = document.createElement('div');
    div.innerHTML = '<span class="' + (cls || '') + '">' + esc(txt) + '</span>';
    con.appendChild(div);
    con.scrollTop = con.scrollHeight;
  }
  if (window._session) {
    if (!window._session.consoleLog) window._session.consoleLog = [];
    window._session.consoleLog.push({ txt, cls: cls || '' });
    if (window._session.consoleLog.length > 500) window._session.consoleLog.splice(0, window._session.consoleLog.length - 500);
    clearTimeout(log._saveT);
    log._saveT = setTimeout(() => { try { persistSession(); } catch (e) {} }, 300);
  }
}
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

      state.filter = p.dataset.s;

      renderList();
    });
  });
  document.getElementById('r-new').addEventListener('click', () => {

    inp.onchange = () => {
      const f = inp.files[0]; if (!f) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const arr = JSON.parse(reader.result);
          if (!Array.isArray(arr)) throw new Error('非数组');
          saveJSON(LS_RULES, arr);
          toast('已导入 ' + arr.length + ' 条规则');

      +   '<div class="field"><label>权重（影响加权聚合）</label><input id="f-weight" type="number" step="0.1" min="0" value="' + r.weight + '"></div>'

      +   '<div class="hint">例：轻微违规=minor / 影响结论=major / 服务错对象=critical。</div></div>'
      + '<div class="field"><label>必需证据</label><textarea id="f-evidence">' + esc(r.evidence || '') + '</textarea>'
      +   '<div class="hint">判定该规则命中所需的最少证据来源（trace/report/artifact）。</div></div>'

      + '<td>' + j.n + '</td>'
      + '<td>' + j.layers.map(l => '<span class="tag info">' + l.toUpperCase() + '</span>').join(' ') + '</td>'
      + '<td class="mono">' + (loadJSON(LS_CONFIG, DEFAULT_CONFIG).model_id) + '</td>'
      + '</tr>').join('')
    + '</tbody></table>';
}

// ---------- boot ----------
route();

// 顶栏状态：网关健康 + 当前是否在评估中
function updateTopStatus() {
  const el = document.getElementById('config-status');
  const dot = document.querySelector('header .live');
  const cfg = loadJSON(LS_CONFIG, DEFAULT_CONFIG);
  const running = window._session && window._session.running;
  if (running) {
    el.textContent = '⚡ 评估进行中 · 切页不会中断（' + cfg.model_id + '）';
    dot.style.background = '#3b82f6';
    return;
  }
  // 简单标记：由 pingGateway 结果覆盖
  if (!el.dataset.gwState) { el.textContent = 'Gateway 状态检测中 · ' + cfg.model_id; }
}

// 顶栏实时探测网关
(async function pingGateway() {
  const cfg = loadJSON(LS_CONFIG, DEFAULT_CONFIG);
  const el = document.getElementById('config-status');
  const dot = document.querySelector('header .live');
  try {
    const r = await fetch((cfg.backend_url || 'http://localhost:8787').replace(/\/$/, '') + '/health');
    if (r.ok) {
      el.dataset.gwState = 'online';
      if (!window._session || !window._session.running) {
        el.textContent = 'Gateway 在线 · ' + cfg.model_id;
        dot.style.background = '#22c55e';
      }
    } else throw 0;
  } catch (e) {
    el.dataset.gwState = 'offline';
    if (!window._session || !window._session.running) {
      el.textContent = 'Gateway 离线（点击 ③ 配置）';
      dot.style.background = '#f0b93a';
    }
  }
  updateTopStatus();
})();

// 页面关闭前保存
window.addEventListener('beforeunload', () => { try { persistSession(); } catch (e) {} });
</script>
</body>
</html>
